apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "looker.fullname" . }}
  labels:
    {{- include "looker.labels" . | nindent 4 }}
    {{- if .Values.additionalLabels }}
    {{- toYaml .Values.additionalLabels | nindent 4 }}
    {{- end }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "looker.selectorLabels" . | nindent 6 }}
  strategy:
    type: Recreate
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "looker.selectorLabels" . | nindent 8 }}
        {{- if .Values.additionalLabels }}
        {{- toYaml .Values.additionalLabels | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "looker.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        - name: link-jar-to-home
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          workingDir: /home/looker
          volumeMounts:
          - mountPath: /data
            name: {{ template "looker.fullname" . }}-shared-data-dir
          - mountPath: /home/looker
            name: looker-home
          command:
            - /bin/sh
            - -c
          args:
            - |
              ln -s /opt/looker/looker-dependencies.jar /home/looker/looker-dependencies.jar
              ln -s /opt/looker/looker.jar /home/looker/looker.jar
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          workingDir: /home/looker
          lifecycle:
            postStart:
              exec:
                command: ["/bin/sh", "-c", "rm -rf /home/looker/.tmp/jruby* /home/looker/.tmp/looker-tmp*"]
          env:
{{- if .Values.extraEnvs }}
{{ toYaml .Values.extraEnvs | indent 10 }}
{{- end }}
          ports:
            - name: web
              containerPort: 9999
              protocol: TCP
            - name: api
              containerPort: 19999
              protocol: TCP
          livenessProbe:
{{ toYaml .Values.probes.livenessProbe | indent 12 }}
          readinessProbe:
{{ toYaml .Values.probes.readinessProbe | indent 12 }}
          startupProbe:
{{ toYaml .Values.probes.startupProbe | indent 12 }}
          terminationMessagePolicy: FallbackToLogsOnError
          volumeMounts:
          - mountPath: /data
            name: {{ template "looker.fullname" . }}-shared-data-dir
          - mountPath: /home/looker
            name: looker-home
          - mountPath: /home/looker/looker-db.yml
            name: db-secret
            subPath: looker-db.yml
          {{- if .Values.database.ssl.enabled }}
          - mountPath: /certs
            name: certs
          {{- end }}
          - mountPath: /tmp
            name: tmp-volume
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
      - name: {{ template "looker.fullname" . }}-shared-data-dir
        {{- if .Values.persistence.enabled }}
        persistentVolumeClaim:
          claimName: {{ .Values.persistence.existingClaim | default (printf "%s-%s" (include "looker.fullname" .) "data") }}
        {{- else }}
        emptyDir:
          medium: "Memory"
        {{- end }}
      - name: tmp-volume
        emptyDir:
          medium: "Memory"
      - name: looker-home
        emptyDir:
          medium: "Memory"
      - name: db-secret
        secret:
          secretName: {{ include "looker.fullname" . }}
      {{- if .Values.database.ssl.enabled }}
      - name: certs
        configMap:
          name: {{ include "looker.fullname" . }}-certs
      {{- end }}
{{- if .Values.databaseConfigSecretName }}
      - name: db-secret
        secret:
          secretName: {{ .Values.databaseConfigSecretName }}
{{- end }}
