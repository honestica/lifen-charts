apiVersion: v1
kind: Service
metadata:
  name: {{ include "looker.fullname" . }}
  labels:
    {{- include "looker.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: 9999
      targetPort: web
      protocol: TCP
      name: web
    - port: 19999
      targetPort: api
      protocol: TCP
      name: api
  selector:
    {{- include "looker.selectorLabels" . | nindent 4 }}
